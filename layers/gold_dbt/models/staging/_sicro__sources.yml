version: 2

sources:
  - name: sicro_silver
    description: >
      Silver Parquet output of the SICRO parse pipeline
      (sources/sicro/parse.py), written to Azure Blob Storage under
      silver/sicro_relatorio_sintetico/. One row per item per source file,
      already cleaned/typed per docs/sicro_data_cleaning.md — but not yet
      deduplicated across revisions (see `revisado`) or joined to reference
      data. mao_de_obra reads with union_by_name because SICRO changed that
      report's column layout partway through 2025 (see REPORT_SCHEMAS in
      sources/sicro/reader.py) — older and newer files coexist in
      the same glob with different schemas.
    tables:
      - name: materiais
        meta:
          external_location: "read_parquet('azure://{{ env_var('AZURE_STORAGE_CONTAINER') }}/silver/sicro_relatorio_sintetico/report_type=materiais/**/*.parquet', union_by_name=true)"
      - name: equipamentos
        meta:
          external_location: "read_parquet('azure://{{ env_var('AZURE_STORAGE_CONTAINER') }}/silver/sicro_relatorio_sintetico/report_type=equipamentos/**/*.parquet', union_by_name=true)"
      - name: mao_de_obra
        meta:
          external_location: "read_parquet('azure://{{ env_var('AZURE_STORAGE_CONTAINER') }}/silver/sicro_relatorio_sintetico/report_type=mao_de_obra/**/*.parquet', union_by_name=true)"
